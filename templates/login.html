<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login • Meal Planner</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
  }

  /* Top Bar */
  nav {
    background: #2d6a4f;
    color: #fff;
    padding: 14px 24px;
    display: flex;
    justify-content: flex-start;
    align-items: center;
  }
  nav span {
    font-size: 20px;
    font-weight: bold;
  }

  /* Login Card */
  .container {
    max-width: 380px;
    margin: 80px auto;
    background: #fff;
    padding: 32px;
    border-radius: 12px;
    border: 1px solid #ddd;
  }

  h2 {
    text-align: left;
    margin-bottom: 24px;
    color: #2d6a4f;
  }

  label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    color: #555;
  }

  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    margin-bottom: 18px;
    font-size: 14px;
  }

  button {
    width: 100%;
    padding: 10px;
    background: #2d6a4f;
    color: #fff;
    border: none;
    border-radius: 7px;
    font-size: 15px;
    cursor: pointer;
  }

  button:hover {
    background: #245a42;
  }

  .link {
    text-align: center;
    margin-top: 14px;
    font-size: 14px;
  }

  .link a {
    color: #2d6a4f;
    text-decoration: none;
    font-weight: bold;
  }
</style>
</head>

<body>

<nav>
  <span>Meal Planner</span>
</nav>

<div class="container">
  <h2>Login</h2>

  <label>Email</label>
  <input id="email" type="email" placeholder="Enter your email">

  <label>Password</label>
  <input id="password" type="password" placeholder="Enter your password">

  <button onclick="login()">Login</button>

  <div class="link">
    Don't have an account? <a href="/signup">Sign up</a>
  </div>
</div>

<script>
async function login() {
  const data = {
    email: document.getElementById("email").value,
    password: document.getElementById("password").value
  };

  const res = await fetch("/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(data)
  });

  const result = await res.json();

  if (res.status === 200) {
    window.location.href = "/dashboard";
  } else {
    alert(result.detail);
  }
}
</script>

</body>
</html>
